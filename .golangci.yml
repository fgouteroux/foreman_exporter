version: "2"

linters:
  enable:
    - revive
  disable:
    # Disabled historically to avoid false positives with build-tag-disabled
    # files (inherited from node_exporter).
    - unused
  settings:
    revive:
      rules:
        # Documentation-style rules are intentionally relaxed for this exporter.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    errcheck:
      # Used in HTTP handlers, any error is handled by the server itself, and
      # go-kit logger calls (still used at the dskit boundary in ring.go) never
      # return meaningful errors.
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (github.com/go-kit/log.Logger).Log
  exclusions:
    rules:
      - path: _test.go
        linters:
          - errcheck
